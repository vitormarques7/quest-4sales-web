name: CI – Build and Test Spring Boot

on:
  push:
    branches: [ main, develop, feat/controle-estado-auditoria ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build e testes com Maven
        run: mvn -B clean verify
